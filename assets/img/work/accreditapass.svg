<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 640 512" preserveAspectRatio="xMidYMid meet" version="1.0">
  <title>AccreditaPass</title>
  <defs>
    <radialGradient id="w1-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w1-pitch" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#C2A3FF"/>
      <stop offset="0.5" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#8C00D9"/>
    </radialGradient>
    <linearGradient id="w1-pass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#8C00D9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="512" fill="#0A0A0A"/>
  <circle cx="290" cy="262" r="215" fill="url(#w1-glow)"/>

  <!-- stadium -->
  <g transform="translate(236 284) scale(0.88)">
    <!-- floodlight masts -->
    <g stroke="#C2A3FF" stroke-width="3" fill="none">
      <path d="M -158 -66 L -158 -136 M 158 -66 L 158 -136 M -92 -92 L -92 -172 M 92 -92 L 92 -172"/>
    </g>
    <g fill="#C2A3FF">
      <rect x="-180" y="-152" width="44" height="18" rx="4" opacity="0.8"/>
      <rect x="136"  y="-152" width="44" height="18" rx="4" opacity="0.8"/>
      <rect x="-116" y="-190" width="48" height="20" rx="4"/>
      <rect x="68"   y="-190" width="48" height="20" rx="4"/>
    </g>
    <!-- outer bowl -->
    <ellipse rx="196" ry="112" fill="none" stroke="#C2A3FF" stroke-width="3.5"/>
    <ellipse rx="196" ry="112" fill="#A100FF" opacity="0.08"/>
    <!-- tiered stands -->
    <ellipse rx="166" ry="92" fill="none" stroke="#C2A3FF" stroke-width="2" opacity="0.5"/>
    <ellipse rx="138" ry="74" fill="none" stroke="#C2A3FF" stroke-width="2" opacity="0.34"/>
    <g stroke="#C2A3FF" stroke-width="2" opacity="0.3">
      <path d="M 0 -112 L 0 -74 M 0 112 L 0 74 M -196 0 L -138 0 M 196 0 L 138 0"/>
      <path d="M -139 -79 L -98 -52 M 139 -79 L 98 -52 M -139 79 L -98 52 M 139 79 L 98 52"/>
    </g>
    <!-- pitch -->
    <ellipse rx="112" ry="58" fill="url(#w1-pitch)"/>
    <g stroke="#0A0A0A" stroke-width="2.5" fill="none" opacity="0.55">
      <path d="M 0 -58 L 0 58"/>
      <circle r="21"/>
      <path d="M -112 -22 L -84 -22 L -84 22 L -112 22"/>
      <path d="M 112 -22 L 84 -22 L 84 22 L 112 22"/>
    </g>
  </g>

  <!-- credential -->
  <g transform="translate(470 132)">
    <path d="M 46 0 L 46 26" stroke="#C2A3FF" stroke-width="3" fill="none"/>
    <rect x="26" y="-14" width="40" height="18" rx="9" fill="none" stroke="#C2A3FF" stroke-width="3"/>
    <rect x="0" y="26" width="92" height="138" rx="10" fill="url(#w1-pass)"/>
    <rect x="0" y="26" width="92" height="138" rx="10" fill="none" stroke="#C2A3FF" stroke-width="2" opacity="0.65"/>
    <circle cx="46" cy="74" r="17" fill="none" stroke="#0A0A0A" stroke-width="3" opacity="0.55"/>
    <path d="M 30 106 C 30 88, 62 88, 62 106" fill="none" stroke="#0A0A0A" stroke-width="3" opacity="0.55"/>
    <g stroke="#0A0A0A" stroke-width="3" opacity="0.4">
      <path d="M 18 126 L 74 126 M 18 140 L 60 140"/>
    </g>
    <g stroke="#0A0A0A" stroke-width="3" opacity="0.45">
      <path d="M 18 152 L 18 160 M 26 152 L 26 160 M 32 152 L 32 160 M 40 152 L 40 160 M 46 152 L 46 160 M 56 152 L 56 160 M 62 152 L 62 160 M 72 152 L 72 160"/>
    </g>
  </g>
</svg>
