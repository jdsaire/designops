<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 640 512" preserveAspectRatio="xMidYMid meet" version="1.0">
  <title>Front-End Evolution</title>
  <defs>
    <radialGradient id="w4-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w4-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2A3FF"/>
      <stop offset="0.5" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#8C00D9"/>
    </linearGradient>
    <linearGradient id="w4-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#8C00D9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="512" fill="#0A0A0A"/>
  <circle cx="320" cy="248" r="222" fill="url(#w4-glow)"/>

  <!-- the alien -->
  <g transform="translate(196 236)">
    <!-- eye stalks -->
    <g fill="none" stroke="#C2A3FF" stroke-width="3" stroke-linecap="round">
      <path d="M -40 -58 C -52 -84, -58 -98, -64 -112"/>
      <path d="M  40 -58 C  52 -84,  58 -98,  64 -112"/>
    </g>
    <circle cx="-64" cy="-118" r="8" fill="#C2A3FF"/>
    <circle cx="64"  cy="-118" r="8" fill="#C2A3FF"/>

    <!-- shell -->
    <path d="M -86 16 C -86 -38, -48 -70, 0 -70 C 48 -70, 86 -38, 86 16
             L 86 42 C 86 56, 74 68, 60 68 L -60 68 C -74 68, -86 56, -86 42 Z"
          fill="#A100FF" fill-opacity="0.10" stroke="#C2A3FF" stroke-width="3"/>
    <path d="M -74 26 C -40 40, 40 40, 74 26" fill="none" stroke="#C2A3FF" stroke-width="2" opacity="0.42"/>
    <path d="M -64 48 C -34 58, 34 58, 64 48" fill="none" stroke="#C2A3FF" stroke-width="2" opacity="0.28"/>

    <!-- visor -->
    <rect x="-60" y="-40" width="120" height="42" rx="21" fill="url(#w4-core)"/>
    <rect x="-60" y="-40" width="120" height="42" rx="21" fill="none" stroke="#C2A3FF" stroke-width="2" opacity="0.6"/>
    <circle cx="-26" cy="-19" r="10" fill="#0A0A0A" opacity="0.72"/>
    <circle cx="26"  cy="-19" r="10" fill="#0A0A0A" opacity="0.72"/>
    <circle cx="-29" cy="-23" r="3.4" fill="#C2A3FF"/>
    <circle cx="23"  cy="-23" r="3.4" fill="#C2A3FF"/>

    <!-- limbs -->
    <g fill="none" stroke="#C2A3FF" stroke-width="3" stroke-linecap="round">
      <path d="M -58 68 C -70 88, -78 100, -86 118"/>
      <path d="M -22 68 C -26 90, -28 102, -30 120"/>
      <path d="M  22 68 C  26 90,  28 102,  30 120"/>
      <path d="M  58 68 C  70 88,  78 100,  86 118"/>
    </g>
    <g fill="#C2A3FF" opacity="0.85">
      <circle cx="-86" cy="122" r="5"/><circle cx="-30" cy="124" r="5"/>
      <circle cx="30"  cy="124" r="5"/><circle cx="86"  cy="122" r="5"/>
    </g>
  </g>

  <!-- the developer -->
  <g transform="translate(452 236)">
    <!-- antenna -->
    <path d="M 0 -108 L 0 -86" fill="none" stroke="#C2A3FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-116" r="9" fill="#C2A3FF"/>

    <!-- head -->
    <rect x="-62" y="-86" width="124" height="92" rx="22" fill="#A100FF" fill-opacity="0.10" stroke="#C2A3FF" stroke-width="3"/>
    <rect x="-46" y="-70" width="92" height="58" rx="10" fill="url(#w4-screen)"/>
    <path d="M -28 -56 L -14 -41 L -28 -26" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <path d="M -4 -26 L 26 -26"             fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

    <!-- neck, then torso -->
    <path d="M -16 2 L -16 30 M 16 2 L 16 30" fill="none" stroke="#C2A3FF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <rect x="-66" y="26" width="132" height="98" rx="20" fill="#A100FF" fill-opacity="0.10" stroke="#C2A3FF" stroke-width="3"/>
    <rect x="-40" y="44" width="80" height="46" rx="8" fill="url(#w4-screen)"/>
    <g stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M -26 58 L 12 58 M -26 70 L 2 70 M -26 80 L 20 80"/>
    </g>
    <circle cx="26" cy="60" r="5" fill="#0A0A0A" opacity="0.5"/>
    <path d="M -34 104 L 34 104" stroke="#C2A3FF" stroke-width="2" opacity="0.32" fill="none"/>

    <!-- arms -->
    <g fill="none" stroke="#C2A3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -66 46 L -92 62 L -92 92"/>
      <path d="M  66 46 L  92 62 L  92 92"/>
    </g>
    <circle cx="-92" cy="98" r="7" fill="#C2A3FF"/>
    <circle cx="92"  cy="98" r="7" fill="#C2A3FF"/>

    <!-- legs -->
    <rect x="-42" y="124" width="30" height="42" rx="10" fill="#A100FF" fill-opacity="0.10" stroke="#C2A3FF" stroke-width="3"/>
    <rect x="12"  y="124" width="30" height="42" rx="10" fill="#A100FF" fill-opacity="0.10" stroke="#C2A3FF" stroke-width="3"/>
  </g>

  <!-- the ladder they stand on: nine rungs, one per repository -->
  <g stroke="#A100FF" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 72 446 L 96 446" opacity="0.3"/>
    <path d="M 108 438 L 132 438" opacity="0.39"/>
    <path d="M 144 430 L 168 430" opacity="0.47"/>
    <path d="M 180 422 L 204 422" opacity="0.56"/>
    <path d="M 216 414 L 240 414" opacity="0.65"/>
    <path d="M 252 406 L 276 406" opacity="0.74"/>
    <path d="M 288 398 L 312 398" opacity="0.82"/>
    <path d="M 324 390 L 348 390" opacity="0.91"/>
    <path d="M 360 382 L 384 382" opacity="1.0"/>
  </g>
</svg>
