<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 640 512" preserveAspectRatio="xMidYMid meet" version="1.0">
  <title>Front-End Evolution</title>
  <defs>
    <radialGradient id="w4-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w4-bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#8C00D9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="512" fill="#0A0A0A"/>
  <circle cx="320" cy="256" r="215" fill="url(#w4-glow)"/>

  <!-- arcade alien, built from the grid -->
  <g transform="translate(112 186)" fill="#C2A3FF">
    <rect x="40" y="0" width="20" height="20"/>
    <rect x="160" y="0" width="20" height="20"/>
    <rect x="60" y="20" width="20" height="20"/>
    <rect x="140" y="20" width="20" height="20"/>
    <rect x="40" y="40" width="140" height="20"/>
    <rect x="20" y="60" width="40" height="20"/>
    <rect x="80" y="60" width="60" height="20"/>
    <rect x="160" y="60" width="40" height="20"/>
    <rect x="0" y="80" width="220" height="20"/>
    <rect x="0" y="100" width="20" height="20"/>
    <rect x="40" y="100" width="140" height="20"/>
    <rect x="200" y="100" width="20" height="20"/>
    <rect x="0" y="120" width="20" height="20"/>
    <rect x="40" y="120" width="20" height="20"/>
    <rect x="160" y="120" width="20" height="20"/>
    <rect x="200" y="120" width="20" height="20"/>
    <rect x="60" y="140" width="40" height="20"/>
    <rect x="120" y="140" width="40" height="20"/>
  </g>

  <!-- the developer, built on the same grid -->
  <g transform="translate(366 150)">
    <g fill="#C2A3FF">
    <rect x="90" y="0" width="18" height="18"/>
    <rect x="72" y="18" width="54" height="18"/>
    <rect x="36" y="36" width="126" height="18"/>
    <rect x="36" y="54" width="126" height="18"/>
    <rect x="36" y="72" width="126" height="18"/>
    <rect x="36" y="90" width="126" height="18"/>
    <rect x="0" y="108" width="198" height="18"/>
    <rect x="0" y="126" width="18" height="18"/>
    <rect x="54" y="126" width="90" height="18"/>
    <rect x="180" y="126" width="18" height="18"/>
    <rect x="54" y="144" width="90" height="18"/>
    <rect x="54" y="162" width="36" height="18"/>
    <rect x="108" y="162" width="36" height="18"/>
    <rect x="36" y="180" width="54" height="18"/>
    <rect x="108" y="180" width="54" height="18"/>
    </g>
    <!-- visor, carrying a prompt -->
    <rect x="42" y="58" width="114" height="46" rx="4" fill="#A100FF"/>
    <path d="M 74 72 L 90 81 L 74 90" fill="none" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 92 L 128 92"      fill="none" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round"/>
    <!-- antenna tip -->
    <rect x="86" y="-16" width="26" height="16" rx="4" fill="#A100FF"/>
  </g>

  <!-- the ladder they stand on: nine rungs, one per repository -->
  <g stroke="#A100FF" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 72 428 L 100 428" opacity="0.30"/><path d="M 124 420 L 152 420" opacity="0.38"/>
    <path d="M 176 412 L 204 412" opacity="0.46"/><path d="M 228 404 L 256 404" opacity="0.54"/>
    <path d="M 280 396 L 308 396" opacity="0.62"/><path d="M 332 388 L 360 388" opacity="0.70"/>
    <path d="M 384 380 L 412 380" opacity="0.78"/><path d="M 436 372 L 464 372" opacity="0.86"/>
    <path d="M 488 364 L 516 364" opacity="1"/>
  </g>
</svg>
