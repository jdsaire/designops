    <rect x="330" y="169" width="30" height="30" rx="3"/><rect x="402" y="169" width="30" height="30" rx="3"/><rect x="474" y="169" width="30" height="30" rx="3"/><rect x="546" y="169" width="30" height="30" rx="3"/><rect x="618" y="169" width="30" height="30" rx="3"/>
    <rect x="330" y="241" width="30" height="30" rx="3"/><rect x="402" y="241" width="30" height="30" rx="3"/><rect x="474" y="241" width="30" height="30" rx="3"/><rect x="546" y="241" width="30" height="30" rx="3"/><rect x="618" y="241" width="30" height="30" rx="3"/>
    <rect x="330" y="313" width="30" height="30" rx="3"/><rect x="402" y="313" width="30" height="30" rx="3"/><rect x="474" y="313" width="30" height="30" rx="3"/><rect x="546" y="313" width="30" height="30" rx="3"/><rect x="618" y="313" width="30" height="30" rx="3"/>
    <rect x="330" y="385" width="30" height="30" rx="3"/><rect x="402" y="385" width="30" height="30" rx="3"/><rect x="474" y="385" width="30" height="30" rx="3"/><rect x="546" y="385" width="30" height="30" rx="3"/><rect x="618" y="385" width="30" height="30" rx="3"/>
