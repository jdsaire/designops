<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 768 576" preserveAspectRatio="xMidYMid meet" version="1.0">
  <title>Augmentation</title>
  <defs>
    <linearGradient id="g-solid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#8C00D9"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="768" height="576" fill="#0A0A0A"/>
  <circle cx="430" cy="288" r="225" fill="url(#g-glow)"/>

  <!-- single input -->
  <rect x="120" y="268" width="40" height="40" rx="4" fill="url(#g-solid)"/>

  <!-- multiplication -->
  <g fill="none" stroke="#A100FF" stroke-width="1.5" opacity="0.42">
    <path d="M 160 288 L 508 136"/>
    <path d="M 160 288 L 508 187"/>
    <path d="M 160 288 L 508 238"/>
    <path d="M 160 288 L 508 288"/>
    <path d="M 160 288 L 508 338"/>
    <path d="M 160 288 L 508 389"/>
    <path d="M 160 288 L 508 440"/>
  </g>

  <!-- multiplied output -->
  <g fill="none" stroke="#C2A3FF" stroke-width="1.5">
    <rect x="508" y="123" width="26" height="26" rx="3" opacity="0.42"/>
    <rect x="508" y="174" width="26" height="26" rx="3" opacity="0.54"/>
    <rect x="508" y="225" width="26" height="26" rx="3" opacity="0.68"/>
    <rect x="508" y="275" width="26" height="26" rx="3" opacity="0.82"/>
    <rect x="508" y="325" width="26" height="26" rx="3" opacity="0.68"/>
    <rect x="508" y="376" width="26" height="26" rx="3" opacity="0.54"/>
    <rect x="508" y="427" width="26" height="26" rx="3" opacity="0.42"/>
  </g>
  <g fill="#A100FF">
    <rect x="550" y="132" width="46"  height="8" rx="4" opacity="0.30"/>
    <rect x="550" y="183" width="72"  height="8" rx="4" opacity="0.42"/>
    <rect x="550" y="234" width="98"  height="8" rx="4" opacity="0.56"/>
    <rect x="550" y="284" width="124" height="8" rx="4" opacity="0.70"/>
    <rect x="550" y="334" width="98"  height="8" rx="4" opacity="0.56"/>
    <rect x="550" y="385" width="72"  height="8" rx="4" opacity="0.42"/>
    <rect x="550" y="436" width="46"  height="8" rx="4" opacity="0.30"/>
  </g>
</svg>
