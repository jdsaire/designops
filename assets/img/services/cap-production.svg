<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 768 583.92" preserveAspectRatio="xMidYMid meet" version="1.0">
  <title>Production</title>
  <defs>
    <linearGradient id="p-solid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#8C00D9"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A100FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="768" height="583.92" fill="#0A0A0A"/>
  <circle cx="548" cy="292" r="215" fill="url(#p-glow)"/>

  <!-- dispersed brief fragments -->
  <g fill="none" stroke="#C2A3FF" stroke-width="1.5">
    <rect x="96"  y="170" width="28" height="28" rx="3" opacity="0.28"/>
    <rect x="96"  y="240" width="28" height="28" rx="3" opacity="0.40"/>
    <rect x="96"  y="344" width="28" height="28" rx="3" opacity="0.34"/>
    <rect x="96"  y="414" width="28" height="28" rx="3" opacity="0.22"/>
    <rect x="168" y="205" width="28" height="28" rx="3" opacity="0.38"/>
    <rect x="168" y="278" width="28" height="28" rx="3" opacity="0.55"/>
    <rect x="168" y="379" width="28" height="28" rx="3" opacity="0.42"/>
    <rect x="240" y="240" width="28" height="28" rx="3" opacity="0.62"/>
    <rect x="240" y="330" width="28" height="28" rx="3" opacity="0.58"/>
  </g>

  <!-- convergence -->
  <g fill="none" stroke="#A100FF" stroke-width="1.5" opacity="0.42">
    <path d="M 276 254 L 452 285"/>
    <path d="M 276 292 L 452 292"/>
    <path d="M 276 344 L 452 299"/>
  </g>

  <!-- shipped product -->
  <rect x="452" y="196" width="192" height="192" rx="8" fill="url(#p-solid)"/>
  <g stroke="#0A0A0A" stroke-width="1.5" opacity="0.35">
    <path d="M 516 196 L 516 388"/>
    <path d="M 580 196 L 580 388"/>
    <path d="M 452 260 L 644 260"/>
    <path d="M 452 324 L 644 324"/>
  </g>
  <path d="M 460 200 L 636 200" stroke="#C2A3FF" stroke-width="2" opacity="0.75" fill="none"/>
</svg>
