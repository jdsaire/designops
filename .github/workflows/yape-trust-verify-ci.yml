# CI for the Brief 04 sub-app only.
#
# Scoped by path: the rest of the site is zero-build vanilla HTML/CSS/JS and must never acquire a
# build requirement. This workflow is additive and independent of static.yml, which continues to
# deploy the repository as-is on push to main.
name: yape-trust-verify CI

on:
  push:
    branches: ['main']
    paths:
      - 'work/yape-trust-verify/**'
      - '.github/workflows/yape-trust-verify-ci.yml'
  pull_request:
    paths:
      - 'work/yape-trust-verify/**'
      - '.github/workflows/yape-trust-verify-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: work/yape-trust-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: work/yape-trust-verify/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built output is checked in and served directly by Pages, so it must match the source it
      # was built from. If a rebuild changes any tracked file, the committed output is stale and the
      # deployed app would not be the app in src/.
      - name: Built output is in sync with source
        run: |
          if [ -n "$(git status --porcelain -- . ':!node_modules')" ]; then
            echo "::error::Committed build output does not match a fresh build of src/. Run 'npm run build' and commit the result."
            git status --porcelain -- . ':!node_modules'
            git diff -- . ':!node_modules' | head -100
            exit 1
          fi
          echo "Built output matches source."

      # The site is served from a /designops/ project path; a leading-slash asset path would resolve
      # against the domain root and 404. The rest of the site holds this invariant, and so does this
      # sub-app.
      - name: No absolute asset paths
        run: |
          if grep -nE '(src|href)="/|url\(/|fetch\(.[/]' index.html assets/*.js assets/*.css; then
            echo "::error::Absolute leading-slash path found in built output."
            exit 1
          fi
          echo "All asset paths are relative."
